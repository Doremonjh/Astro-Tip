name: Astro-Tip CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Lint errors will be shown in the logs,
      # but they will NOT fail the workflow.
      - name: Run Lint (non-blocking)
        run: npm run lint --if-present || true

      - name: Run Tests
        run: npm test --if-present

      - name: Build Application
        run: npm run build